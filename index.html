<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Varyant Tahmin Oyunu</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            margin: 20px 0;
            background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0%, 100% { filter: hue-rotate(0deg); }
            50% { filter: hue-rotate(30deg); }
        }

        /* Navigation tabs */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        .nav-tab {
            padding: 8px 20px;
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            background: transparent;
            color: rgba(255,255,255,0.6);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-tab:hover { border-color: rgba(255,255,255,0.3); color: #fff; }
        .nav-tab.active {
            background: rgba(255,255,255,0.1);
            border-color: #48dbfb;
            color: #48dbfb;
        }

        .scoreboard {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 12px 0;
            font-size: 1rem;
            flex-wrap: wrap;
        }

        .scoreboard span {
            background: rgba(255,255,255,0.1);
            padding: 6px 16px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }

        .game-area {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 25px;
            margin: 15px 0;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .pokemon-display {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pokemon-display img {
            width: 220px;
            height: 220px;
            image-rendering: pixelated;
            transition: filter 0.5s ease;
        }

        .pokemon-display img.silhouette { filter: brightness(0) saturate(0); }
        .pokemon-display img.partial { filter: brightness(0.3) saturate(0.2) blur(2px); }
        .pokemon-display img.revealed {
            filter: none;
            animation: popIn 0.4s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .hint-area { margin: 12px 0; min-height: 50px; }

        .hint {
            background: rgba(255,255,255,0.08);
            display: inline-block;
            padding: 5px 14px;
            border-radius: 12px;
            margin: 3px;
            font-size: 0.85rem;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .type-badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            margin: 2px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }

        .option-btn {
            padding: 12px 18px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 14px;
            background: rgba(255,255,255,0.06);
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: capitalize;
        }

        .option-btn:hover {
            background: rgba(255,255,255,0.15);
            border-color: rgba(255,255,255,0.4);
            transform: translateY(-2px);
        }

        .option-btn.correct {
            background: rgba(72, 219, 251, 0.3);
            border-color: #48dbfb;
            animation: pulse 0.5s ease;
        }

        .option-btn.wrong {
            background: rgba(255, 107, 107, 0.3);
            border-color: #ff6b6b;
        }

        .option-btn:disabled { cursor: not-allowed; opacity: 0.7; }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .controls {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .ctrl-btn {
            padding: 10px 24px;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .ctrl-btn:hover { transform: translateY(-2px); }

        .btn-hint { background: linear-gradient(135deg, #feca57, #f39c12); color: #1a1a2e; }
        .btn-next { background: linear-gradient(135deg, #48dbfb, #0abde3); color: #1a1a2e; }
        .btn-start { background: linear-gradient(135deg, #ff6b6b, #ee5a24); color: #fff; font-size: 1.1rem; padding: 14px 36px; }
        .btn-pokedex { background: linear-gradient(135deg, #ff9ff3, #f368e0); color: #1a1a2e; }
        .btn-sound { background: rgba(255,255,255,0.15); color: #fff; font-size: 1.2rem; padding: 8px 14px; }

        .difficulty-select { margin: 15px 0; }
        .difficulty-select label { display: block; margin-bottom: 8px; font-size: 1rem; }

        .diff-buttons, .mode-buttons {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .diff-btn, .mode-btn {
            padding: 8px 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            background: transparent;
            color: #fff;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .diff-btn:hover, .diff-btn.active,
        .mode-btn:hover, .mode-btn.active {
            background: rgba(255,255,255,0.15);
            border-color: #48dbfb;
        }

        .message {
            font-size: 1.2rem;
            margin: 8px 0;
            font-weight: bold;
            min-height: 30px;
        }

        .message.correct-msg { color: #48dbfb; }
        .message.wrong-msg { color: #ff6b6b; }

        .round-info {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.6);
            margin-bottom: 8px;
        }

        .timer-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            margin: 8px 0;
            overflow: hidden;
        }

        .timer-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.1s linear;
            background: linear-gradient(90deg, #48dbfb, #0abde3);
        }

        .timer-fill.warning { background: linear-gradient(90deg, #feca57, #f39c12); }
        .timer-fill.danger { background: linear-gradient(90deg, #ff6b6b, #ee5a24); }

        .game-over { animation: fadeIn 0.5s ease; }
        .game-over h2 { font-size: 2rem; margin-bottom: 12px; }

        .final-score {
            font-size: 3rem;
            font-weight: bold;
            background: linear-gradient(90deg, #feca57, #48dbfb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .streak-display { color: #feca57; }

        /* Lives (survival mode) */
        .lives { color: #ff6b6b; font-size: 1.1rem; }

        /* Evolution chain */
        .evo-chain {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 12px 0;
            flex-wrap: wrap;
        }

        .evo-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.4s ease;
        }

        .evo-item img {
            width: 60px;
            height: 60px;
            image-rendering: pixelated;
        }

        .evo-item.current { transform: scale(1.2); }
        .evo-item.current img { border: 2px solid #48dbfb; border-radius: 50%; padding: 2px; }

        .evo-arrow { font-size: 1.5rem; color: rgba(255,255,255,0.4); }

        .evo-item span {
            font-size: 0.7rem;
            text-transform: capitalize;
            color: rgba(255,255,255,0.7);
            margin-top: 3px;
        }

        /* Pokedex */
        .pokedex-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px;
            margin: 15px 0;
            max-height: 500px;
            overflow-y: auto;
            padding: 10px;
        }

        .pokedex-entry {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 8px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.08);
            transition: all 0.2s;
        }

        .pokedex-entry:hover { background: rgba(255,255,255,0.1); }

        .pokedex-entry img {
            width: 50px;
            height: 50px;
            image-rendering: pixelated;
        }

        .pokedex-entry.unknown img { filter: brightness(0); }
        .pokedex-entry.unknown { opacity: 0.4; }

        .pokedex-entry span {
            display: block;
            font-size: 0.65rem;
            text-transform: capitalize;
            color: rgba(255,255,255,0.7);
            margin-top: 2px;
        }

        .pokedex-stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 10px 0;
            color: rgba(255,255,255,0.7);
        }

        /* Leaderboard */
        .leaderboard {
            text-align: left;
            max-width: 500px;
            margin: 15px auto;
        }

        .lb-entry {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            border-radius: 10px;
            margin: 6px 0;
            background: rgba(255,255,255,0.05);
        }

        .lb-entry:nth-child(1) { background: rgba(255, 215, 0, 0.15); }
        .lb-entry:nth-child(2) { background: rgba(192, 192, 192, 0.12); }
        .lb-entry:nth-child(3) { background: rgba(205, 127, 50, 0.12); }

        .lb-rank {
            font-weight: bold;
            width: 30px;
            font-size: 1.1rem;
        }

        .lb-info { flex: 1; margin-left: 10px; }
        .lb-score { font-weight: bold; color: #feca57; }
        .lb-mode { font-size: 0.75rem; color: rgba(255,255,255,0.5); }

        /* Confetti canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        /* Combo display */
        .combo-popup {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.5rem;
            font-weight: bold;
            pointer-events: none;
            z-index: 10;
            animation: comboAnim 1s ease forwards;
        }

        @keyframes comboAnim {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
            30% { transform: translate(-50%, -50%) scale(1.3); }
            100% { opacity: 0; transform: translate(-50%, -80%) scale(1); }
        }

        /* XP bar */
        .xp-bar-container {
            margin: 10px auto;
            max-width: 300px;
        }

        .xp-bar {
            width: 100%;
            height: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            overflow: hidden;
        }

        .xp-fill {
            height: 100%;
            background: linear-gradient(90deg, #feca57, #ff9ff3);
            border-radius: 5px;
            transition: width 0.5s ease;
        }

        .xp-label {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.6);
            margin-top: 4px;
        }

        /* Trainer level badge */
        .trainer-badge {
            display: inline-block;
            background: linear-gradient(135deg, #feca57, #f39c12);
            color: #1a1a2e;
            padding: 3px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: bold;
            margin: 5px;
        }

        /* Type colors */
        .type-normal { background: #a8a878; }
        .type-fire { background: #f08030; }
        .type-water { background: #6890f0; }
        .type-electric { background: #f8d030; color: #333; }
        .type-grass { background: #78c850; }
        .type-ice { background: #98d8d8; color: #333; }
        .type-fighting { background: #c03028; }
        .type-poison { background: #a040a0; }
        .type-ground { background: #e0c068; color: #333; }
        .type-flying { background: #a890f0; }
        .type-psychic { background: #f85888; }
        .type-bug { background: #a8b820; }
        .type-rock { background: #b8a038; }
        .type-ghost { background: #705898; }
        .type-dragon { background: #7038f8; }
        .type-dark { background: #705848; }
        .type-steel { background: #b8b8d0; color: #333; }
        .type-fairy { background: #ee99ac; color: #333; }

        @media (max-width: 600px) {
            h1 { font-size: 1.5rem; }
            .options-grid { grid-template-columns: 1fr; }
            .pokemon-display { width: 180px; height: 180px; }
            .pokemon-display img { width: 160px; height: 160px; }
            .nav-tabs { gap: 4px; }
            .nav-tab { padding: 6px 12px; font-size: 0.8rem; }
            .pokedex-grid { grid-template-columns: repeat(auto-fill, minmax(65px, 1fr)); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Pokemon Varyant Tahmin Oyunu</h1>
        <div class="nav-tabs">

    <script>
    const app = document.getElementById('app');
    const confettiCanvas = document.getElementById('confetti-canvas');
    const confettiCtx = confettiCanvas.getContext('2d');

    // ============ CONSTANTS ============
    const TOTAL_ROUNDS = 10;
    const TIMER_DURATION = { easy: 20, medium: 15, hard: 10 };
    const SURVIVAL_LIVES = 3;
    const XP_PER_LEVEL = 100;

    // ============ POKEMON POOL (100+) ============
    const POKEMON_POOL = [

        {id:129,name:'magikarp'},{id:130,name:'gyarados'},{id:131,name:'lapras'},
        {id:133,name:'eevee'},{id:134,name:'vaporeon'},{id:135,name:'jolteon'},
        {id:136,name:'flareon'},{id:143,name:'snorlax'},{id:144,name:'articuno'},
        {id:145,name:'zapdos'},{id:146,name:'moltres'},{id:147,name:'dratini'},
        {id:149,name:'dragonite'},{id:150,name:'mewtwo'},{id:151,name:'mew'},
        // Gen 2
        {id:152,name:'chikorita'},{id:155,name:'cyndaquil'},{id:157,name:'typhlosion'},
        {id:158,name:'totodile'},{id:160,name:'feraligatr'},{id:175,name:'togepi'},

        {id:196,name:'espeon'},{id:197,name:'umbreon'},{id:212,name:'scizor'},
        {id:214,name:'heracross'},{id:229,name:'houndoom'},{id:248,name:'tyranitar'},
        {id:249,name:'lugia'},{id:250,name:'ho-oh'},{id:251,name:'celebi'},
        // Gen 3
        {id:252,name:'treecko'},{id:255,name:'torchic'},{id:257,name:'blaziken'},
        {id:258,name:'mudkip'},{id:260,name:'swampert'},{id:282,name:'gardevoir'},
        {id:302,name:'sableye'},{id:330,name:'flygon'},{id:350,name:'milotic'},
        {id:359,name:'absol'},{id:373,name:'salamence'},{id:376,name:'metagross'},
        {id:380,name:'latias'},{id:381,name:'latios'},{id:384,name:'rayquaza'},
        // Gen 4
        {id:387,name:'turtwig'},{id:390,name:'chimchar'},{id:392,name:'infernape'},
        {id:393,name:'piplup'},{id:395,name:'empoleon'},{id:403,name:'shinx'},
        {id:405,name:'luxray'},{id:445,name:'garchomp'},{id:448,name:'lucario'},
        {id:461,name:'weavile'},{id:468,name:'togekiss'},{id:470,name:'leafeon'},
        {id:471,name:'glaceon'},{id:475,name:'gallade'},{id:483,name:'dialga'},
        {id:484,name:'palkia'},{id:487,name:'giratina'},
        // Gen 5
        {id:495,name:'snivy'},{id:498,name:'tepig'},{id:501,name:'oshawott'},
        {id:553,name:'krookodile'},{id:571,name:'zoroark'},{id:609,name:'chandelure'},
        {id:612,name:'haxorus'},{id:635,name:'hydreigon'},{id:637,name:'volcarona'},
        // Gen 6+
        {id:650,name:'chespin'},{id:653,name:'fennekin'},{id:656,name:'froakie'},
        {id:658,name:'greninja'},{id:700,name:'sylveon'},{id:706,name:'goodra'},
        {id:718,name:'zygarde'},{id:722,name:'rowlet'},{id:724,name:'decidueye'},
        {id:725,name:'litten'},{id:727,name:'incineroar'},{id:728,name:'popplio'},
        {id:778,name:'mimikyu'},{id:802,name:'marshadow'},
    ];

    const TYPE_NAMES_TR = {
        normal:'Normal',fire:'Ates',water:'Su',electric:'Elektrik',
        grass:'Bitki',ice:'Buz',fighting:'Dovus',poison:'Zehir',
        ground:'Toprak',flying:'Ucus',psychic:'Psisik',bug:'Bocek',
        rock:'Kaya',ghost:'Hayalet',dragon:'Ejderha',dark:'Karanlik',
        steel:'Celik',fairy:'Peri'
    };

    const STAT_NAMES_TR = {
        hp:'HP',attack:'Saldiri',defense:'Savunma',
        'special-attack':'Ozel Saldiri','special-defense':'Ozel Savunma',speed:'Hiz'
    };

    // ============ STATE ============
    let state = {
        score: 0, round: 0, streak: 0, bestStreak: 0,
        difficulty: 'medium', gameMode: 'classic',
        hintsUsed: 0, totalHintsUsed: 0,
        timerInterval: null, timeLeft: 0,
        answered: false, currentPokemon: null,
        options: [], hints: [],
        usedPokemonIds: new Set(),
        lives: SURVIVAL_LIVES,
        soundEnabled: true,
        currentPage: 'game',
        roundResults: []
    };

    // ============ PERSISTENCE ============
    function loadSave() {
        try {
            const d = JSON.parse(localStorage.getItem('pokemon_game_save') || '{}');
            return {
                pokedex: new Set(d.pokedex || []),
                leaderboard: d.leaderboard || [],
                totalXP: d.totalXP || 0,
                gamesPlayed: d.gamesPlayed || 0
            };
        } catch { return { pokedex: new Set(), leaderboard: [], totalXP: 0, gamesPlayed: 0 }; }
    }

    function savePersistent() {
        const d = {
            pokedex: [...persist.pokedex],
            leaderboard: persist.leaderboard,
            totalXP: persist.totalXP,
            gamesPlayed: persist.gamesPlayed
        };
        localStorage.setItem('pokemon_game_save', JSON.stringify(d));
    }

    let persist = loadSave();

    function getTrainerLevel() {
        return Math.floor(persist.totalXP / XP_PER_LEVEL) + 1;
    }

    function getXPProgress() {
        return persist.totalXP % XP_PER_LEVEL;
    }

    // ============ SOUND ENGINE ============
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playSound(type) {
        if (!state.soundEnabled) return;
        try {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            switch(type) {
                case 'correct':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523, now);
                    osc.frequency.setValueAtTime(659, now + 0.1);
                    osc.frequency.setValueAtTime(784, now + 0.2);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialApproachTarget(0.001, 0.3, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.4);
                    break;
                case 'wrong':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.setValueAtTime(150, now + 0.15);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialApproachTarget(0.001, 0.2, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.35);
                    break;
                case 'hint':
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.setValueAtTime(550, now + 0.08);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialApproachTarget(0.001, 0.15, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.25);
                    break;
                case 'tick':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, now);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.exponentialApproachTarget(0.001, 0.05, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.06);
                    break;
                case 'levelup':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523, now);
                    osc.frequency.setValueAtTime(659, now + 0.12);
                    osc.frequency.setValueAtTime(784, now + 0.24);
                    osc.frequency.setValueAtTime(1047, now + 0.36);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialApproachTarget(0.001, 0.3, now + 0.55);
                    osc.start(now);
                    osc.stop(now + 0.6);
                    break;
                case 'gameover':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(392, now);
                    osc.frequency.setValueAtTime(330, now + 0.2);
                    osc.frequency.setValueAtTime(262, now + 0.4);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialApproachTarget(0.001, 0.4, now + 0.65);
                    osc.start(now);
                    osc.stop(now + 0.7);
                    break;
            }
        } catch(e) {}
    }

    // ============ CONFETTI ============
    let confettiParticles = [];
    let confettiAnimating = false;

    function resizeConfetti() {
        confettiCanvas.width = window.innerWidth;
        confettiCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeConfetti);
    resizeConfetti();

    function spawnConfetti(count = 60) {
        const colors = ['#ff6b6b','#feca57','#48dbfb','#ff9ff3','#1dd1a1','#54a0ff'];
        for (let i = 0; i < count; i++) {
            confettiParticles.push({
                x: Math.random() * confettiCanvas.width,
                y: -10 - Math.random() * 50,
                w: 6 + Math.random() * 6,
                h: 4 + Math.random() * 4,
                color: colors[Math.floor(Math.random() * colors.length)],
                vx: (Math.random() - 0.5) * 4,
                vy: 2 + Math.random() * 4,
                rot: Math.random() * Math.PI * 2,
                rotSpeed: (Math.random() - 0.5) * 0.2,
                life: 1
            });
        }
        if (!confettiAnimating) animateConfetti();
    }

    function animateConfetti() {
        confettiAnimating = true;
        confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

        confettiParticles = confettiParticles.filter(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.1;
            p.rot += p.rotSpeed;
            p.life -= 0.005;

            if (p.life <= 0 || p.y > confettiCanvas.height + 20) return false;

            confettiCtx.save();
            confettiCtx.translate(p.x, p.y);
            confettiCtx.rotate(p.rot);
            confettiCtx.globalAlpha = p.life;
            confettiCtx.fillStyle = p.color;
            confettiCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
            confettiCtx.restore();
            return true;
        });

        if (confettiParticles.length > 0) {
            requestAnimationFrame(animateConfetti);
        } else {
            confettiAnimating = false;
            confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        }
    }

    // ============ UTILS ============
    function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    // ============ START GAME ============
    window.startGame = async function() {
        state.score = 0;
        state.round = 0;
        state.streak = 0;
        state.bestStreak = 0;
        state.hintsUsed = 0;
        state.totalHintsUsed = 0;
        state.usedPokemonIds = new Set();
        state.lives = SURVIVAL_LIVES;
        state.roundResults = [];
        await nextRound();
    };

    // ============ NEXT ROUND ============
    async function nextRound() {
        state.round++;
        state.answered = false;
        state.hints = [];

        // Check game over conditions
        if (state.gameMode === 'classic' && state.round > TOTAL_ROUNDS) {
            endGame(); return;
        }
        if (state.gameMode === 'survival' && state.lives <= 0) {
            endGame(); return;
        }

        const roundLabel = state.gameMode === 'survival'
            ? `Tur ${state.round}`
            : `Tur ${state.round}/${TOTAL_ROUNDS}`;

        app.innerHTML = `
            <div class="scoreboard">
                <span>Skor: ${state.score}</span>
                <span>${roundLabel}</span>
                ${state.gameMode === 'survival' ? `<span class="lives">${'❤️'.repeat(state.lives)}</span>` : ''}
                <span class="streak-display">Seri: ${state.streak}</span>
            </div>
            <div class="game-area">
                <p style="color:rgba(255,255,255,0.5);">Pokemon yukleniyor...</p>
            </div>
        `;

        try {
            let available = POKEMON_POOL.filter(p => !state.usedPokemonIds.has(p.id));
            if (available.length < 4) { state.usedPokemonIds.clear(); available = POKEMON_POOL; }

            const correct = shuffle(available)[0];
            state.usedPokemonIds.add(correct.id);

            const wrongOptions = shuffle(POKEMON_POOL.filter(p => p.id !== correct.id)).slice(0, 3);
            const options = shuffle([correct, ...wrongOptions]);

            const [pokemonRes, ] = await Promise.all([
                fetch(`https://pokeapi.co/api/v2/pokemon/${correct.id}`),
            ]);
            const data = await pokemonRes.json();
            const speciesData = await (await fetch(data.species.url)).json();

            state.currentPokemon = { id: correct.id, name: correct.name, data, species: speciesData };
            state.options = options;

            renderRound();
        } catch (err) {
            app.innerHTML = `
                <div class="game-area">
                    <p>Hata: ${err.message}</p>
                    <button class="ctrl-btn btn-next" onclick="nextRound()">Tekrar Dene</button>
                </div>
            `;
        }
    }

    // ============ TIMER ============
    function startTimer(seconds) {
        clearInterval(state.timerInterval);
        state.timeLeft = seconds * 10;
        const max = state.timeLeft;
        let lastTickAt = max;

        state.timerInterval = setInterval(() => {
            state.timeLeft--;
            const pct = (state.timeLeft / max) * 100;
            const fill = document.getElementById('timerFill');
            if (!fill) { clearInterval(state.timerInterval); return; }

            fill.style.width = pct + '%';
            if (pct < 25) {
                fill.className = 'timer-fill danger';
                // tick sound in last 25%
                if (state.timeLeft % 10 === 0 && state.timeLeft !== lastTickAt) {
                    lastTickAt = state.timeLeft;
                    playSound('tick');
                }
            }
            else if (pct < 50) fill.className = 'timer-fill warning';

            if (state.timeLeft <= 0) {
                clearInterval(state.timerInterval);
                if (!state.answered) timeUp();
            }
        }, 100);
    }

    function timeUp() {
        state.answered = true;
        state.streak = 0;
        if (state.gameMode === 'survival') state.lives--;
        playSound('wrong');

        state.roundResults.push({ name: state.currentPokemon.name, correct: false });

        const msg = document.getElementById('message');
        if (msg) {
            msg.className = 'message wrong-msg';
            msg.textContent = `Sure doldu! Cevap: ${state.currentPokemon.name}`;
            if (state.gameMode === 'survival' && state.lives <= 0)
                msg.textContent += ' | Son canini kaybettin!';
        }
        revealPokemon(false);
    }

    // ============ GUESS ============
    window.guess = function(name) {
        if (state.answered) return;
        state.answered = true;
        clearInterval(state.timerInterval);

        const isCorrect = name === state.currentPokemon.name;
        const msg = document.getElementById('message');
        const buttons = document.querySelectorAll('.option-btn');

        buttons.forEach(btn => {
            btn.disabled = true;
            const btnName = btn.textContent.trim();
            if (btnName === state.currentPokemon.name) btn.classList.add('correct');
            else if (btnName === name && !isCorrect) btn.classList.add('wrong');
        });

        if (isCorrect) {
            const timeBonus = Math.floor(state.timeLeft / 10);
            const hintPenalty = state.hints.length * 5;
            const diffMult = { easy: 1, medium: 1.5, hard: 2 }[state.difficulty];
            const modeMult = state.gameMode === 'speedrun' ? 2 : 1;
            const streakBonus = Math.min(state.streak * 3, 15);
            const points = Math.max(5, Math.floor((10 + timeBonus + streakBonus - hintPenalty) * diffMult * modeMult));

            state.score += points;
            state.streak++;
            if (state.streak > state.bestStreak) state.bestStreak = state.streak;

            // XP
            const oldLevel = getTrainerLevel();
            persist.totalXP += Math.floor(points / 2);
            persist.pokedex.add(state.currentPokemon.id);
            savePersistent();
            const newLevel = getTrainerLevel();

            playSound('correct');
            spawnConfetti(state.streak >= 3 ? 80 : 40);

            msg.className = 'message correct-msg';
            let msgText = `Dogru! +${points} puan`;
            if (state.streak > 1) msgText += ` (${state.streak}x seri!)`;
            if (newLevel > oldLevel) {
                msgText += ` | SEVIYE ATLADIN! Lv.${newLevel}`;
                playSound('levelup');
                spawnConfetti(100);
            }
            msg.textContent = msgText;

            // Show combo popup for streaks
            if (state.streak >= 3) showCombo(state.streak);

        } else {
            state.streak = 0;
            if (state.gameMode === 'survival') state.lives--;

            playSound('wrong');

            msg.className = 'message wrong-msg';
            let msgText = `Yanlis! Dogru cevap: ${state.currentPokemon.name}`;
            if (state.gameMode === 'survival' && state.lives <= 0)
                msgText += ' | Son canini kaybettin!';
            msg.textContent = msgText;
        }

        state.roundResults.push({ name: state.currentPokemon.name, correct: isCorrect });
        revealPokemon(isCorrect);
    };

    function showCombo(streak) {
        const ga = document.querySelector('.game-area');
        if (!ga) return;
        const div = document.createElement('div');
        div.className = 'combo-popup';
        div.style.color = streak >= 5 ? '#ff6b6b' : '#feca57';
        div.textContent = `${streak}x KOMBO!`;
        ga.appendChild(div);
        setTimeout(() => div.remove(), 1200);
    }

            }

    // ============ EVOLUTION CHAIN ============
    async function loadEvoChain() {
        try {
            const species = state.currentPokemon.species;
            const evoRes = await fetch(species.evolution_chain.url);
            const evoData = await evoRes.json();

            const chain = [];
            let current = evoData.chain;
            while (current) {
                const name = current.species.name;
                const idMatch = current.species.url.match(/\/(\d+)\//);
                const id = idMatch ? idMatch[1] : 1;
                chain.push({ name, id });
                current = current.evolves_to?.[0] || null;
            }

            if (chain.length <= 1) return;

            const evoDiv = document.getElementById('evoChain');
            if (!evoDiv) return;

            let html = '<div class="evo-chain">';
            chain.forEach((evo, i) => {
                if (i > 0) html += '<span class="evo-arrow">→</span>';
                const isCurrent = evo.name === state.currentPokemon.name;
                html += `
                    <div class="evo-item ${isCurrent ? 'current' : ''}">
                        <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${evo.id}.png" alt="${evo.name}">
                        <span>${evo.name}</span>
                    </div>
                `;
            });
            html += '</div>';
            evoDiv.innerHTML = html;
        } catch(e) {}
    }

    // ============ HINTS ============
    window.getHint = function() {
        if (state.hints.length >= 3 || state.answered) return;
        playSound('hint');

        const data = state.currentPokemon.data;
        const species = state.currentPokemon.species;

        const allHints = [];

        // Type
        const types = data.types.map(t => TYPE_NAMES_TR[t.type.name] || t.type.name);
        allHints.push(`Tip: ${types.join(', ')}`);

        // Highest stat
        const highest = data.stats.reduce((a, b) => a.base_stat > b.base_stat ? a : b);
        allHints.push(`En yuksek stat: ${STAT_NAMES_TR[highest.stat.name] || highest.stat.name} (${highest.base_stat})`);

        // Size
        allHints.push(`Boy: ${data.height / 10}m | Kilo: ${data.weight / 10}kg`);

        // Generation
        const genMatch = species.generation?.name?.match(/generation-(.+)/);
        if (genMatch) allHints.push(`Nesil: ${genMatch[1].toUpperCase()}`);

        // Ability
        if (data.abilities.length > 0)
            allHints.push(`Yetenek: ${data.abilities[0].ability.name.replace(/-/g, ' ')}`);

        // First letter
        allHints.push(`Ilk harf: ${state.currentPokemon.name[0].toUpperCase()}`);

        const unused = allHints.filter(h => !state.hints.includes(h));
        if (unused.length > 0) state.hints.push(unused[0]);

        state.totalHintsUsed++;

        if (state.difficulty === 'hard' && state.hints.length >= 2) {
            const img = document.getElementById('pokemonImg');
            if (img && img.classList.contains('silhouette')) img.className = 'partial';
        }

        renderRound();
    };

    // ============ POKEDEX ============
    function renderPokedex() {
        clearInterval(state.timerInterval);
        const caught = persist.pokedex.size;
        const total = POKEMON_POOL.length;
        const pct = Math.round((caught / total) * 100);

        let html = `
            <div class="game-area">
                <h2 style="margin-bottom:10px;">Pokedex</h2>
                <div class="pokedex-stats">
                    <span>Yakalanan: ${caught}/${total}</span>
                    <span>Tamamlanma: %${pct}</span>
                </div>
                <div class="xp-bar" style="max-width:300px; margin:8px auto;">
                    <div class="xp-fill" style="width:${pct}%; background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb);"></div>
                </div>
                <div class="pokedex-grid">
        `;

        POKEMON_POOL.forEach(p => {
            const known = persist.pokedex.has(p.id);
            html += `
                <div class="pokedex-entry ${known ? '' : 'unknown'}">
                    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.id}.png" alt="${p.name}">
                    <span>#${p.id} ${known ? p.name : '???'}</span>
                </div>
            `;
        });

        html += `</div>
            ${caught > 0 ? `<button class="ctrl-btn" style="background:rgba(255,107,107,0.3); color:#ff6b6b; margin-top:10px; font-size:0.8rem;" onclick="resetPokedex()">Pokedex'i Sifirla</button>` : ''}
            </div>`;

        app.innerHTML = html;
    }

    window.resetPokedex = function() {
        if (confirm('Pokedex sifirlansin mi?')) {
            persist.pokedex = new Set();
            savePersistent();
            renderPokedex();
        }
    };

    // ============ LEADERBOARD ============
    function renderLeaderboard() {
        clearInterval(state.timerInterval);
        const lb = persist.leaderboard;
        const modeLabels = { classic: 'Klasik', survival: 'Hayatta Kal', speedrun: 'Hiz Turu' };
        const diffLabels = { easy: 'Kolay', medium: 'Orta', hard: 'Zor' };

        let html = `<div class="game-area"><h2 style="margin-bottom:15px;">Skor Tablosu</h2>`;

        if (lb.length === 0) {
            html += `<p style="color:rgba(255,255,255,0.5);">Henuz skor yok. Bir oyun oyna!</p>`;
        } else {
            html += `<div class="leaderboard">`;
            lb.forEach((e, i) => {
                const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '';
                html += `
                    <div class="lb-entry">
                        <span class="lb-rank">${medal || (i + 1)}</span>
                        <span class="lb-info">
                            <span class="lb-score">${e.score} puan</span>
                            <span class="lb-mode">${modeLabels[e.mode] || e.mode} | ${diffLabels[e.difficulty] || e.difficulty} | Seri: ${e.streak} | ${e.date}</span>
                        </span>
                    </div>
                `;
            });
            html += `</div>`;
            html += `<button class="ctrl-btn" style="background:rgba(255,107,107,0.3); color:#ff6b6b; margin-top:10px; font-size:0.8rem;" onclick="resetLeaderboard()">Tabloyu Sifirla</button>`;
        }

        html += `</div>`;
        app.innerHTML = html;
    }

    window.resetLeaderboard = function() {
        if (confirm('Skor tablosu silinsin mi?')) {
            persist.leaderboard = [];
            savePersistent();
            renderLeaderboard();
        }
    };

    // ============ INIT ============
    renderMenu();
    </script>
</body>
</html>
